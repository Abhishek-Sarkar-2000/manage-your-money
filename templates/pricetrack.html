{% extends "base.html" %}
{% block title %}Price Tracker — Manage Your Money{% endblock %}
{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/charts.css') }}?v={{ static_version }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/views/pricetrack.css') }}?v={{ static_version }}" />
{% endblock %}
{% block content %}
  <div id="pricetrack-root" class="pricetrack-view" data-loading="true" aria-busy="true">
    <div class="pricetrack-loading-state" role="status" aria-label="Loading Price Tracker">
      <div class="pricetrack-loading-shell" aria-hidden="true">
        <div class="pricetrack-loading-heading"><span class="pricetrack-skeleton-line is-title"></span><span class="pricetrack-skeleton-line is-copy"></span></div>
        <div class="pricetrack-skeleton-panel"><div class="pricetrack-skeleton-section-head"><span class="pricetrack-skeleton-line is-section-title"></span><span class="pricetrack-skeleton-line is-button"></span></div><div class="pricetrack-skeleton-fields"><span></span><span></span><span></span></div></div>
        <div class="pricetrack-skeleton-items-heading"><span class="pricetrack-skeleton-line is-section-title"></span></div>
        <div class="pricetrack-skeleton-category-grid">
          {% for _ in range(3) %}
          <div class="pricetrack-skeleton-panel pricetrack-skeleton-category">
            <div class="pricetrack-skeleton-category-head"><span class="pricetrack-skeleton-line is-category"></span><span class="pricetrack-skeleton-line is-card-meta"></span></div>
            <div class="pricetrack-skeleton-category-items">
              {% for _ in range(3) %}
              <div class="pricetrack-skeleton-item"><div><span class="pricetrack-skeleton-line is-card-title"></span><span class="pricetrack-skeleton-line is-card-meta"></span></div><div><span class="pricetrack-skeleton-line is-card-value"></span><span class="pricetrack-skeleton-line is-card-meta"></span></div></div>
              {% endfor %}
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
{% endblock %}
{% block page_script %}
  <script type="module" src="{{ url_for('static', filename='js/views/pricetrack.js') }}"></script>
{% endblock %}
