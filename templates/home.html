<!-- templates/home.html -->
{% extends "base.html" %}

{% block title %}Home — Manage Your Money{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/charts.css') }}?v={{ static_version }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/views/home.css') }}?v={{ static_version }}" />
{% endblock %}

{% block content %}
  <!-- Our MPA entry script will mount directly to this div -->
  <div id="home-root" class="home-view" data-loading="true">
    <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
      <div class="card" style="box-shadow: var(--shadow); padding: 40px 30px; width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 200px;">
        <!-- Simple modern CSS loading spinner -->
        <div style="width: 36px; height: 36px; border: 3px solid var(--ice); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 24px;"></div>
        <!-- Centered text positioned toward the bottom with top margin -->
        <div style="color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; text-align: center; margin-top: auto;">
          Loading dashboard...
        </div>
      </div>
    </div>
  </div>
  
  <!-- Add the spinner keyframes if not already globally defined -->
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
{% endblock %}

{% block page_script %}
  <script type="module" src="{{ url_for('static', filename='js/views/home.js') }}"></script>
{% endblock %}
