<!-- templates/home.html -->
{% extends "base.html" %}

{% block title %}Home — Manage Your Money{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/charts.css') }}?v={{ static_version }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/views/home.css') }}?v={{ static_version }}" />
{% endblock %}

{% block content %}
  <div id="home-root" class="home-view" data-loading="true">
    <div class="home-loading-state">
      <div class="home-loading-card card">
        <div class="home-loading-spinner" aria-hidden="true"></div>
        <div class="home-loading-copy">Loading dashboard...</div>
      </div>
    </div>
  </div>
  
  <!-- Add the spinner keyframes if not already globally defined -->
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
{% endblock %}

{% block page_script %}
  <script type="module" src="{{ url_for('static', filename='js/views/home.js') }}"></script>
{% endblock %}
