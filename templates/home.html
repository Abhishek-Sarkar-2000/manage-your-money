<!-- templates/home.html -->
{% extends "base.html" %}

{% block title %}Home — Manage Your Money{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/charts.css') }}?v={{ static_version }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/views/home.css') }}?v={{ static_version }}" />
{% endblock %}

{% block content %}
  <div id="home-root" class="home-view" data-loading="true" aria-busy="true">
    <div class="home-loading-state" role="status" aria-label="Loading dashboard">
      <div class="home-loading-shell" aria-hidden="true">
        <div class="home-loading-heading">
          <span class="home-skeleton-line is-kicker"></span>
          <span class="home-skeleton-line is-title"></span>
          <span class="home-skeleton-line is-copy"></span>
        </div>

        <div class="home-skeleton home-loading-hero">
          <span class="home-skeleton-line is-kicker"></span>
          <span class="home-skeleton-line is-hero-title"></span>
          <span class="home-skeleton-line is-copy"></span>
        </div>

        <div class="home-loading-kpi-grid">
          {% for _ in range(4) %}
            <div class="home-skeleton home-loading-kpi">
              <span class="home-skeleton-line is-kicker"></span>
              <span class="home-skeleton-line is-value"></span>
              <span class="home-skeleton-line is-meta"></span>
            </div>
          {% endfor %}
        </div>

        <div class="home-loading-panel-grid">
          <div class="home-skeleton home-loading-panel is-wide"></div>
          <div class="home-skeleton home-loading-panel"></div>
          <div class="home-skeleton home-loading-panel"></div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

{% block page_script %}
  <script type="module" src="{{ url_for('static', filename='js/views/home.js') }}"></script>
{% endblock %}
